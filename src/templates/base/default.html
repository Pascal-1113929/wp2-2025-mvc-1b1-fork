{% from "macros/components/button.html" import button %}

<!doctype html>
<html lang="{{base.language}}">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" href="/static/style/stylesheet.css" />
        <title>Accessibility Hub</title>
    </head>
    <body>
        {% block navbar %}
            <nav>
                <div class="container-horizontal">
                    <div class="cell">
                        {{ button(text=lang.nav_home, href=".") }}
                        {{ button(text=lang.nav_debug, href=".debug") }}
                    </div>
                    <div class="cell float-right">
                        {{ button(text=lang.nav_login, href=".login") }}
                    </div>
                </div>
            </nav>
        {% endblock %}

        {% block content %}
        {% endblock %}
    </body>
</html>
