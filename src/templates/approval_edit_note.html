{% from "macros/components/link.html" import link %}

{% extends 'layouts/default.html' %}

{% block content %}
<main >
    <section>
        <form class="cm-form" action="{{ url_for('approval.approval_edit_note', language=base.locale, user_id=profile_data.user_id)}}" method="post">

            <div class="form-group">
                <label for="prf-inro">{{ lang.approval_user_editnote_title}} {{ profile_data.first_name }} {{ profile_data.last_name }}</label>
                <textarea id="prf-inro" name="note" rows="4" aria-setsize="false" placeholder="{{ lang.approval_user_editnote_placeholder }}">{{ profile_data.notes }}</textarea>
            </div>

            <div class="grid-section">
                <button class="submit-btn" type="submit">{{ lang.approval_user_editnote_save }}</button>
            </div>
        </form>

    </section>
</main>
{% endblock %}
