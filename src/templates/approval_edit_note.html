{% from "macros/components/link.html" import link %}

{% extends 'layouts/default.html' %}

{% block content %}
<main >
    <section>
        {% if success %}
            <div class="alert alert-success">
                Succesvol Geregistreerd Wachten op Goedkeuring!
            </div>
        {% endif %}

        {% if error %}
            <div class="alert alert-error">
                {{ error }}
            </div>
        {% endif %}
        <form class="cm-form" action="{{ url_for('management.approval_edit_note', language=base.locale, user_id=profile_data.user_id)}}" method="post">

            <div class="form-group">
                <label for="prf-inro">Notes</label>
                <textarea id="prf-inro" name="note" rows="4" aria-setsize="false" placeholder="Vul hier een note voor deze profiel in">{{ profile_data.notes }}</textarea>
            </div>

            <div class="grid-section">
                <button class="submit-btn" type="submit">Opslaan</button>
            </div>
        </form>

    </section>
</main>
{% endblock %}
