{% extends 'layouts/default.html' %} {% block content %}
<main class="home">
    <h1>Account Delete {{ profile.first_name }} {{ profile.last_name }}</h1>
    <p>Are you sure you want to delete this user?</p>
    <form
    method="post"
    action="{{ url_for('account.expert_profile_delete', uid=uid, language=base.locale) }}"
    >
        <button class="s-button">Confirm Delete</button>
    </form>
</main>
{% endblock %}
