{% extends 'layouts/default.html' %}
{% block content %}
<main class="home">
    <form
        class="cm-form"
        action="{{ url_for('account.account_login', language=base.locale)}}"
        method="post"
    >
        {% if post_status %}
        <div class="alert alert-error">Invalid email or password</div>
        {% endif %}
        <div class="form-group">
            <label for="usr-email">Email</label>
            <input
                id="usr-email"
                type="email"
                name="email"
                required
                placeholder="Voer hier uw naam in"
            />
        </div>
        <div class="form-group">
            <label for="usr-pass">Wachtwoord</label>
            <input
                id="usr-pass"
                type="password"
                name="password"
                required
                placeholder="Voer hier uw wachtwoord in"
            />
        </div>
        <div class="form-group">
            <button class="submit-btn" type="submit">Login</button>
    </form>
</main>
{% endblock %}
