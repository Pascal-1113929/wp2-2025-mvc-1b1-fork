{% extends 'layouts/default.html' %}

{% block content %}

<main>
    <h1>Inschrijven voor: {{ study.title }}</h1>
    <form action="/{{ study.id }}/enroll" method="post">

         <label>E-mail:</label>
         <input type="email" name="email" value="{{ user.email }}" readonly>

            <label>Telefoonnummer:</label>
            <input type="number" name="phone" value="{{ profile.phone }}" readonly>
            
            <div class="button-group" >
                <button type="submit" class="button">Bevestigen</button>
                <a href="/{{study.id}}" class="button">Annuleren</a>
            </div>
</main>
