{% extends 'layouts/default.html' %}

{% block content %}
<main class="home">
    <section class="sectioncard">
        <form class="cm-form" action="{{ url_for('account.account_register_save', language=base.locale)}}" method="post">
            <div class="form-group">
                <label for="usr-email">Email</label>
                <input id="usr-email" type="email" name="email" required placeholder="Voer hier uw naam in">
            </div>
            <div class="form-group">
                <label for="usr-pass">Wachtwoord</label>
                <input id="usr-pass" type="password" name="password" required placeholder="Voer hier uw wachtwoord in">
            </div>

            <hr>
            <div class="form-group">
                <label for="prf-name">Voornaam</label>
                <input id="prf-name" type="text" name="fisrtname" required placeholder="vul hier voornaam in">
            </div>

            <div class="form-group">
                <label for="prf-name">Achternaam</label>
                <input id="prf-name" type="text" name="lastname" required placeholder="vul hier achternaam in">
            </div>

            <div class="form-group">
                <label for="prf-disabil">Beperkingen:</label>
                <select id="prf-disabil" name="disability" required>
                    {% for disability in disabilities %}
                    <option value={{ disability.id }}>{{ disability.naam }} - {{ disability.category }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="prf-postal">Postcode</label>
                <input id="prf-postal" type="text" name="postal" placeholder="vul hier postcode in">
            </div>

            <div class="form-group">
                <label for="prf-inro">Intro</label>
                <textarea id="prf-inro" name="intro" rows="4" aria-setsize="false" placeholder="vul hier uw intro voor uw profiel in"></textarea>
            </div>

            <div class="form-group">
                <label for="phone">Telefoonnummer</label>
                <input id="phone" type="text" name="phone" placeholder="Bijv: 067409236450">
            </div>

            <div class="form-group">
                <label for="prf-bdate">Geboorte Datum</label>
                <input id="prf-bdate" type="date" name="birthdate" placeholder="Bijv: 067409236450">
            </div>

            <button class="submit-btn" type="submit">Opslaan</button>
        </form>

        {% if success %}
            <div class="alert alert-success">
                prfanisatie succesvol aangemaakt!
            </div>
        {% endif %}

        {% if error %}
            <div class="alert alert-error">
                {{ error }}
            </div>
        {% endif %}

    </section>
</main>
{% endblock %}
