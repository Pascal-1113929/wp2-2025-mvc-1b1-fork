{% extends 'layouts/default.html' %}

{% block content %}
<main class="home">
    <section class="sectioncard">
        <form class="cm-form" action="{{ url_for('account.account_register_save', language=base.locale)}}" method="post">
            <div class="form-group">
                <label for="usr-email">Email</label>
                <input id="usr-email" type="email" name="email" required placeholder="Voer hier uw naam in">
            </div>
            <div class="form-group">
                <label for="usr-pass">Wachtwoord</label>
                <input id="usr-pass" type="password" name="password" required placeholder="Voer hier uw wachtwoord in">
            </div>

            <hr>
            <div class="form-group">
                <label for="prf-fname">Voornaam</label>
                <input id="prf-fname" type="text" name="fisrtname" required placeholder="vul hier voornaam in">
            </div>

            <div class="form-group">
                <label for="prf-lname">Achternaam</label>
                <input id="prf-lname" type="text" name="lastname" required placeholder="vul hier achternaam in">
            </div>

            <div class="form-group">
                <label for="prf-gender">Gender</label>
                <select id="prf-gender" name="gender" required>
                    <option value="M">Man</option>
                    <option value="V">Vrouw</option>
                    <option value="X">Anders</option>
                </select>
            </div>

            <div class="form-group">
                <label for="prf-disabil">Beperkingen:</label>
                <select id="prf-disabil" name="disability" required>
                    <option value="">Selecteer een Beperking</option> {# Placeholder #}
                    {% for disability in disabilities %}
                        <option value={{ disability.id }}>{{ disability.name }} - {{ disability.category }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="prf-postal">Postcode</label>
                <input id="prf-postal" type="text" name="postal" placeholder="vul hier postcode in">
            </div>

            <div class="form-group">
                <label for="prf-inro">Intro</label>
                <textarea id="prf-inro" name="intro" rows="4" aria-setsize="false" placeholder="vul hier uw intro voor uw profiel in"></textarea>
            </div>

            <div class="form-group">
                <label for="phone">Telefoonnummer</label>
                <input id="phone" type="tel" name="phone" placeholder="Bijv: 067409236450">
            </div>

            <div class="form-group">
                <label for="prf-bdate">Geboorte Datum</label>
                <input id="prf-bdate" type="date" name="birthdate">
            </div>

            <div class="form-group">
                <label for="prf-atools">Hulpmiddelen</label>
                <input id="prf-atools" type="date" name="atools" placeholder="Bijv: Screenreader">
            </div>

            <div class="form-group">
                <label for="prf-contact">Contact preferentie</label>
                <select id="prf-contact" name="gender" required>
                    <option value="telefoon">Telefoom</option>
                    <option value="e-mail">e-mail</option>
                </select>
            </div>

            <div class="form-group">
                <label for="prf-researchtype">Onderzoek type preferentie</label>
                <select id="prf-researchtype" name="gender" required>
                    <option value="telefonisch">Telefonisch</option>
                    <option value="online">Online</option>
                    <option value="op locatie">Op locatie</option>
                </select>
            </div>

            <div class="form-group">
                <label for="prf-availab">Beschikbaarheid</label>
                <input id="prf-availab" type="date" name="availability" placeholder="Bijv: Ma-Wo overdag">
            </div>



            <div class="grid-section">
                <button class="submit-btn" type="submit">Opslaan</button>
                <button class="reset-btn" type="reset">Reset</button>
            </div>
        </form>

        {% if success %}
            <div class="alert alert-success">
                prfanisatie succesvol aangemaakt!
            </div>
        {% endif %}

        {% if error %}
            <div class="alert alert-error">
                {{ error }}
            </div>
        {% endif %}

    </section>
</main>
{% endblock %}
