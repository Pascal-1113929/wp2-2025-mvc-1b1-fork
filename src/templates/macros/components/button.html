{% macro button(href="", text="", class_name="") %}
    {% if href %}
        <a
            {% if href.startswith('.') %}
                href="/{{ request.path.split('/')[1] }}/{{ href[1:] }}"
            {% else %}
                href="{{ href }}"
            {% endif %}
            class="button{% if class_name %} {{ class_name }}{% endif %}"
            >{{ text }}</a
        >
    {% else %}
        <button type="button" class="button{% if class_name %} {{ class_name }}{% endif %}">
            {{ text }}
        </button>
    {% endif %}
{% endmacro %}
