{% macro dropdown(options=[], name="", id="", class="") %}
    <select class="dropdown {{ class }}" name="{{ name }}" {% if id %}id="dropdown-{{ id }}"{% endif %}>
        {% for option in options %}
        <option value="{{ option.value }}" {% if option.selected %}selected{% endif %}>
            {{ option.text }}
        </option>
        {% endfor %}
    </select>
{% endmacro %}
