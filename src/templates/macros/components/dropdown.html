{% macro dropdown(options=[], name="", id="", class="", required=false, placeholder="", value="", multiple=False) %}
    <select class="dropdown {{ class }}" name="{{ name }}" {% if id %}id="dropdown-{{ id }}"{% endif %} {% if required %}required{% endif %} {% if multiple %}multiple{% endif %}>
        {% if placeholder %}
            {% set has_selected = false %}
            {% for option in options %}
                {% if option.selected %}
                    {% set has_selected = true %}
                {% endif %}
            {% endfor %}
            {% if not has_selected %}
                <option value="" disabled {% if not multiple %}selected{% endif %} hidden>{{ placeholder }}</option>
            {% else %}
                <option value="" disabled hidden>{{ placeholder }}</option>
            {% endif %}
        {% endif %}

        {% for option in options %}
            {% set selected_flag = false %}
            {% if multiple and value is iterable %}
                {% if option.value|string in value %}
                    {% set selected_flag = true %}
                {% endif %}
            {% else %}
                {% if option.selected or option.value|string == value|string %}
                    {% set selected_flag = true %}
                {% endif %}
            {% endif %}
            <option {% if option.lang %}lang="{{ option.lang }}"{% endif %} value="{{ option.value }}" {% if selected_flag %}selected{% endif %}>
                {{ option.text }}
            </option>
        {% endfor %}
    </select>
{% endmacro %}
